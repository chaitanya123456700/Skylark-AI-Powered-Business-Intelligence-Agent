<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skylark BI Agent</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Markdown renderer -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{
  --bg:#0B0E14;
  --surface:#12161F;
  --surface-2:#171C27;
  --border:#232B38;
  --text:#EDEFF3;
  --text-muted:#8A93A3;
  --amber:#F0A83C;
  --teal:#3FC7B0;
  --warn:#E2734F;
  --radius:8px;
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 1px 1px,
      rgba(255,255,255,0.035) 1px,
      transparent 0
    ) 0 0/22px 22px,
    var(--bg);

  color:var(--text);
  font-family:'Inter',sans-serif;

  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* =========================
   TOP BAR
   ========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:16px 22px;

  border-bottom:1px solid var(--border);

  background:rgba(11,14,20,0.85);
  backdrop-filter:blur(6px);

  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:30px;
  height:30px;

  border-radius:7px;

  background:linear-gradient(
    145deg,
    var(--amber),
    #c9791f
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Space Grotesk',sans-serif;
  font-weight:700;

  color:#1a1206;
  font-size:15px;
}

.brand-text h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:15.5px;
  font-weight:600;

  margin:0;
  letter-spacing:0.2px;
}

.brand-text span{
  font-size:11.5px;
  color:var(--text-muted);

  font-family:'JetBrains Mono',monospace;
}

.status{
  display:flex;
  align-items:center;
  gap:14px;
}

.sync-pill{
  display:flex;
  align-items:center;
  gap:7px;

  font-family:'JetBrains Mono',monospace;
  font-size:11px;

  color:var(--text-muted);

  border:1px solid var(--border);

  padding:5px 10px;

  border-radius:999px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--teal);

  box-shadow:
    0 0 0 0 rgba(63,199,176,0.6);

  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{
    box-shadow:0 0 0 0 rgba(63,199,176,0.55);
  }

  70%{
    box-shadow:0 0 0 7px rgba(63,199,176,0);
  }

  100%{
    box-shadow:0 0 0 0 rgba(63,199,176,0);
  }
}

@media (prefers-reduced-motion:reduce){
  .dot{
    animation:none;
  }
}

/* =========================
   BUTTONS
   ========================= */

button.ghost{
  background:transparent;

  border:1px solid var(--border);

  color:var(--text-muted);

  font-family:'Inter',sans-serif;
  font-size:12px;

  padding:6px 12px;

  border-radius:6px;

  cursor:pointer;
}

button.ghost:hover{
  color:var(--text);
  border-color:#3a4457;
}

button.ghost:focus-visible,
.chip:focus-visible,
#send:focus-visible,
#input:focus-visible{
  outline:2px solid var(--amber);
  outline-offset:2px;
}

/* =========================
   MAIN
   ========================= */

main{
  flex:1;

  display:flex;
  flex-direction:column;

  max-width:1100px;
  width:100%;

  margin:0 auto;

  padding:22px;

  gap:16px;
}

/* =========================
   QUICK QUESTIONS
   ========================= */

.chips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.chip{
  background:var(--surface);

  border:1px solid var(--border);

  color:var(--text-muted);

  font-size:12px;

  padding:7px 12px;

  border-radius:999px;

  cursor:pointer;

  font-family:'Inter',sans-serif;

  transition:0.15s ease;
}

.chip:hover{
  color:var(--text);
  border-color:var(--amber);
  transform:translateY(-1px);
}

/* =========================
   CHAT
   ========================= */

#log{
  flex:1;

  display:flex;
  flex-direction:column;

  gap:12px;

  padding-bottom:8px;
}

.entry{
  display:flex;
  flex-direction:column;

  gap:6px;

  padding:14px 16px;

  border-radius:var(--radius);

  background:var(--surface);

  border:1px solid var(--border);

  border-left:3px solid var(--border);

  max-width:94%;

  animation:fade .25s ease-out;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(3px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.entry.user{
  align-self:flex-end;
  border-left-color:var(--amber);
  max-width:75%;
}

.entry.assistant{
  align-self:flex-start;
  border-left-color:var(--teal);
  width:94%;
}

.entry.system{
  align-self:center;

  border-left-color:var(--warn);

  background:transparent;

  color:var(--text-muted);

  font-size:12.5px;
}

.meta{
  font-family:'JetBrains Mono',monospace;

  font-size:10.5px;

  color:var(--text-muted);

  letter-spacing:0.3px;

  text-transform:uppercase;
}

.entry.user .meta{
  color:#d99a4e;
}

.entry.assistant .meta{
  color:#5fd6c2;
}

/* =========================
   MARKDOWN BODY
   ========================= */

.body{
  font-size:14px;
  line-height:1.6;

  color:var(--text);

  overflow-x:auto;
}

/* Paragraphs */

.body p{
  margin:8px 0;
}

.body p:first-child{
  margin-top:2px;
}

.body p:last-child{
  margin-bottom:2px;
}

/* Headings */

.body h1,
.body h2,
.body h3,
.body h4{
  font-family:'Space Grotesk',sans-serif;

  color:var(--text);

  line-height:1.3;
}

.body h1{
  font-size:23px;
  margin:8px 0 14px;
}

.body h2{
  font-size:19px;
  margin:20px 0 10px;
}

.body h3{
  font-size:16px;
  margin:18px 0 8px;
}

.body h4{
  font-size:14px;
  margin:15px 0 7px;
}

/* Bold */

.body strong{
  font-weight:700;
  color:var(--text);
}

/* Lists */

.body ul,
.body ol{
  margin:8px 0 12px;

  padding-left:23px;
}

.body li{
  margin:5px 0;
}

.body li::marker{
  color:var(--teal);
}

/* Horizontal line */

.body hr{
  border:0;

  border-top:1px solid var(--border);

  margin:18px 0;
}

/* =========================
   TABLE
   ========================= */

.body table{
  width:100%;

  border-collapse:separate;
  border-spacing:0;

  margin:14px 0;

  font-size:13px;

  border:1px solid var(--border);

  border-radius:8px;

  overflow:hidden;

  background:var(--surface);
}

.body thead th{
  background:var(--surface-2);

  color:var(--text);

  font-weight:600;

  text-align:left;

  white-space:nowrap;
}

.body th,
.body td{
  padding:10px 12px;

  border-bottom:1px solid var(--border);

  border-right:1px solid var(--border);

  vertical-align:middle;
}

.body th:last-child,
.body td:last-child{
  border-right:none;
}

.body tbody tr:last-child td{
  border-bottom:none;
}

.body tbody tr:hover{
  background:rgba(255,255,255,0.025);
}

/* Make numbers look cleaner */

.body td{
  color:#D8DCE4;
}

/* =========================
   CODE
   ========================= */

.body code{
  font-family:'JetBrains Mono',monospace;

  font-size:12px;

  background:var(--surface-2);

  padding:2px 6px;

  border-radius:4px;
}

.body pre{
  background:var(--surface-2);

  border:1px solid var(--border);

  border-radius:7px;

  padding:12px;

  overflow-x:auto;

  margin:12px 0;
}

.body pre code{
  background:transparent;

  padding:0;

  font-size:12px;
}

/* =========================
   BLOCKQUOTE
   ========================= */

.body blockquote{
  border-left:3px solid var(--teal);

  margin:12px 0;

  padding:5px 0 5px 13px;

  color:var(--text-muted);
}

/* =========================
   LINKS
   ========================= */

.body a{
  color:var(--teal);

  text-decoration:none;
}

.body a:hover{
  text-decoration:underline;
}

/* =========================
   TYPING
   ========================= */

.typing{
  display:flex;

  gap:4px;

  padding:4px 0;
}

.typing span{
  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--text-muted);

  animation:blink 1.2s infinite ease-in-out;
}

.typing span:nth-child(2){
  animation-delay:.2s;
}

.typing span:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
  }

  40%{
    opacity:1;
  }
}

/* =========================
   INPUT
   ========================= */

form{
  display:flex;

  gap:10px;

  border-top:1px solid var(--border);

  padding-top:14px;
}

#input{
  flex:1;

  background:var(--surface-2);

  border:1px solid var(--border);

  color:var(--text);

  padding:12px 14px;

  border-radius:var(--radius);

  font-family:'Inter',sans-serif;

  font-size:14px;

  resize:none;

  min-height:44px;
}

#input::placeholder{
  color:var(--text-muted);
}

#input:focus{
  border-color:#3a4457;
  outline:none;
}

#send{
  background:var(--amber);

  color:#1a1206;

  border:none;

  padding:0 20px;

  border-radius:var(--radius);

  font-family:'Space Grotesk',sans-serif;

  font-weight:600;

  font-size:13.5px;

  cursor:pointer;

  min-width:70px;
}

#send:disabled{
  opacity:.5;

  cursor:not-allowed;
}

#send:hover:not(:disabled){
  background:#f4b95d;
}

/* =========================
   FOOTER
   ========================= */

footer{
  text-align:center;

  color:var(--text-muted);

  font-size:11px;

  padding:10px;

  font-family:'JetBrains Mono',monospace;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width:700px){

  .topbar{
    padding:12px 14px;
  }

  .status{
    gap:7px;
  }

  .sync-pill{
    display:none;
  }

  main{
    padding:14px;
  }

  .entry{
    max-width:100%;
  }

  .entry.user{
    max-width:90%;
  }

  .entry.assistant{
    width:100%;
  }

  .body table{
    font-size:12px;
  }

  .body th,
  .body td{
    padding:8px;
  }

  form{
    gap:7px;
  }

  #send{
    padding:0 15px;
  }
}
</style>
</head>

<body>

<!-- =========================
     TOP BAR
     ========================= -->

<div class="topbar">

  <div class="brand">

    <div class="brand-mark">
      SK
    </div>

    <div class="brand-text">

      <h1>
        Skylark BI Agent
      </h1>

      <span>
        deals &amp; work orders // live from monday.com
      </span>

    </div>

  </div>

  <div class="status">

    <div class="sync-pill">

      <span class="dot"></span>

      <span id="sync-label">
        synced
      </span>

    </div>

    <button
      class="ghost"
      id="refresh-btn"
      type="button"
    >
      Refresh data
    </button>

  </div>

</div>


<!-- =========================
     MAIN
     ========================= -->

<main>

  <!-- Quick questions -->

  <div
    class="chips"
    id="chips"
  >

    <button
      class="chip"
      type="button"
    >
      How's our pipeline looking by sector this quarter?
    </button>

    <button
      class="chip"
      type="button"
    >
      What's our win rate over the last 6 months?
    </button>

    <button
      class="chip"
      type="button"
    >
      Any work orders that are overdue right now?
    </button>

    <button
      class="chip"
      type="button"
    >
      Prepare a leadership update on pipeline and delivery health
    </button>

  </div>


  <!-- Chat log -->

  <div id="log">

    <div class="entry system">

      <div class="body">
        Connected. Ask a business question about the Deals or Work Orders boards — e.g. "which sector has the biggest open pipeline?"
      </div>

    </div>

  </div>


  <!-- Input -->

  <form id="chat-form">

    <textarea
      id="input"
      rows="1"
      placeholder="Ask about pipeline, revenue, sectors, delivery..."
      autocomplete="off"
    ></textarea>

    <button
      id="send"
      type="submit"
    >
      Send
    </button>

  </form>

</main>


<footer>
  session resets on server restart // read-only integration with monday.com
</footer>


<script>

/* =========================
   DOM ELEMENTS
   ========================= */

const log = document.getElementById('log');

const form = document.getElementById('chat-form');

const input = document.getElementById('input');

const sendBtn = document.getElementById('send');

const chips = document.getElementById('chips');

const refreshBtn = document.getElementById('refresh-btn');

const syncLabel = document.getElementById('sync-label');


/* =========================
   SESSION
   ========================= */

let sessionId = null;


/* =========================
   TIME
   ========================= */

function timeNow(){

  return new Date().toLocaleTimeString(
    [],
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


/* =========================
   ADD MESSAGE
   ========================= */

function addEntry(role, text){

  const el = document.createElement('div');

  el.className = 'entry ' + role;


  const label =
    role === 'user'
      ? 'you'
      : role === 'assistant'
        ? 'agent'
        : 'system';


  el.innerHTML =
    '<div class="meta">' +
      label +
      ' · ' +
      timeNow() +
    '</div>' +

    '<div class="body"></div>';


  const body = el.querySelector('.body');


  /*
   * IMPORTANT:
   *
   * Assistant responses are Markdown.
   *
   * marked.parse() converts:
   *
   * ### Heading
   * **bold**
   * - bullets
   * | tables |
   *
   * into proper HTML.
   */

  if(
    role === 'assistant' &&
    typeof marked !== 'undefined'
  ){

    body.innerHTML = marked.parse(text);

  }else{

    body.textContent = text;

  }


  log.appendChild(el);

  log.scrollTop = log.scrollHeight;


  return el;

}


/* =========================
   TYPING INDICATOR
   ========================= */

function addTyping(){

  const el = document.createElement('div');

  el.className = 'entry assistant';

  el.id = 'typing-indicator';


  el.innerHTML =
    '<div class="meta">agent</div>' +

    '<div class="typing">' +
      '<span></span>' +
      '<span></span>' +
      '<span></span>' +
    '</div>';


  log.appendChild(el);

  log.scrollTop = log.scrollHeight;

}


/* =========================
   REMOVE TYPING
   ========================= */

function removeTyping(){

  const el =
    document.getElementById('typing-indicator');

  if(el){
    el.remove();
  }

}


/* =========================
   SEND MESSAGE
   ========================= */

async function sendMessage(message){

  if(!message.trim()){
    return;
  }


  /* Add user message */

  addEntry(
    'user',
    message
  );


  /* Clear input */

  input.value = '';

  input.style.height = 'auto';


  /* Disable send */

  sendBtn.disabled = true;


  /* Show typing */

  addTyping();


  try{

    const resp = await fetch(
      '/api/chat',
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json'
        },

        body:JSON.stringify({
          session_id:sessionId,
          message:message
        })
      }
    );


    removeTyping();


    /* Handle HTTP errors */

    if(!resp.ok){

      const err =
        await resp
          .json()
          .catch(
            () => ({
              detail:'Request failed'
            })
          );


      addEntry(
        'system',
        'Error: ' +
        (
          err.detail ||
          resp.statusText
        )
      );


      return;

    }


    /* Parse response */

    const data =
      await resp.json();


    /* Save session */

    sessionId =
      data.session_id;


    /* Display assistant response */

    addEntry(
      'assistant',
      data.reply
    );


  }catch(e){

    removeTyping();


    addEntry(
      'system',
      'Network error: could not reach the backend. Is it running?'
    );


  }finally{

    sendBtn.disabled = false;

    input.focus();

  }

}


/* =========================
   FORM SUBMIT
   ========================= */

form.addEventListener(
  'submit',
  (e) => {

    e.preventDefault();

    sendMessage(
      input.value
    );

  }
);


/* =========================
   ENTER TO SEND
   ========================= */

input.addEventListener(
  'keydown',
  (e) => {

    if(
      e.key === 'Enter' &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage(
        input.value
      );

    }

  }
);


/* =========================
   AUTO RESIZE TEXTAREA
   ========================= */

input.addEventListener(
  'input',
  () => {

    input.style.height =
      'auto';

    input.style.height =
      Math.min(
        input.scrollHeight,
        140
      ) + 'px';

  }
);


/* =========================
   QUICK QUESTION CHIPS
   ========================= */

chips.addEventListener(
  'click',
  (e) => {

    if(
      e.target.classList.contains('chip')
    ){

      sendMessage(
        e.target.textContent.trim()
      );

    }

  }
);


/* =========================
   REFRESH MONDAY DATA
   ========================= */

refreshBtn.addEventListener(
  'click',
  async () => {

    syncLabel.textContent =
      'syncing…';


    try{

      const resp =
        await fetch(
          '/api/refresh',
          {
            method:'POST'
          }
        );


      if(resp.ok){

        syncLabel.textContent =
          'synced ' +
          timeNow();


        addEntry(
          'system',
          'Pulled the latest data from monday.com.'
        );

      }else{

        syncLabel.textContent =
          'sync failed';

      }


    }catch(e){

      syncLabel.textContent =
        'sync failed';

    }

  }
);

</script>

</body>
</html>
